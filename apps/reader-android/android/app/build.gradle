plugins {
    id 'com.android.application'
}

def googleServicesFile = file('google-services.json')
def hasFirebase = googleServicesFile.exists()
if (hasFirebase) {
    apply plugin: 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.wabinfos.app'
    compileSdk 36

    defaultConfig {
        minSdk 22
        targetSdk 36

        buildConfigField "boolean", "HAS_FIREBASE", hasFirebase.toString()
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["product", "push"]
    productFlavors {
        reader {
            dimension "product"
            applicationId "com.wabinfos.app"
            versionCode 32
            versionName "1.2.9"
            buildConfigField "String", "SITE_URL", '"https://wab-infos.com"'
            buildConfigField "String", "VERSION_MANIFEST_URL", '"https://wab-infos.com/downloads/apk-version.json"'
            buildConfigField "String", "UA_MARKER", '"WabInfosNative"'
            buildConfigField "boolean", "USE_NATIVE_GOOGLE", "true"
            manifestPlaceholders = [
                deepLinkHost   : "wab-infos.com",
                deepLinkHostAlt: "www.wab-infos.com",
            ]
        }
        redaction {
            dimension "product"
            applicationId "com.wabinfos.redaction"
            versionCode 5
            versionName "1.0.4"
            buildConfigField "String", "SITE_URL", '"https://redaction.app.wab-infos.com"'
            buildConfigField "String", "VERSION_MANIFEST_URL", '"https://wab-infos.com/downloads/wab-redaction-apk-version.json"'
            buildConfigField "String", "UA_MARKER", '"WabRedactionNative"'
            // Pas de client OAuth Android pour ce package → OAuth web (form_post).
            buildConfigField "boolean", "USE_NATIVE_GOOGLE", "false"
            manifestPlaceholders = [
                deepLinkHost   : "redaction.app.wab-infos.com",
                deepLinkHostAlt: "redaction.app.wab-infos.com",
            ]
        }
        withFcm {
            dimension "push"
        }
        noFcm {
            dimension "push"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    withFcmImplementation platform('com.google.firebase:firebase-bom:33.1.2')
    withFcmImplementation 'com.google.firebase:firebase-messaging'
}
